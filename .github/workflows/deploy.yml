name: Deploy to GitHub Pages

# Static single-file site (no build step). Publishes ONLY _site/ (the repo minus
# .pages-exclude) whenever main updates — docs, briefs and server/ stay in git
# but are never served.
on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs FIRST. This repo is public: fail before anything builds or deploys if a
  # strategy-doc filename, a listed business term (docs only) or a secret pattern
  # is in the tree. Lists: .hygiene-terms, .hygiene-secrets.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Content guard (no strategy docs, no secrets)
        run: bash scripts/hygiene-check.sh --all

  build:
    needs: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build _site (repo minus .pages-exclude)
        run: rsync -a --exclude-from=.pages-exclude ./ _site/

      # Fail closed: never publish a doc/backend file, never ship without the app.
      - name: Guard artifact contents
        run: |
          leaks=$(cd _site && find . \( -name '*.md' -o -name '.*' -o -path './server*' -o -path './evidence*' \) ! -name '.' -print)
          if [ -n "$leaks" ]; then echo "::error::Excluded files reached _site:"; echo "$leaks"; exit 1; fi
          for f in index.html vendor/aepp-sdk.bundle.js; do
            [ -s "_site/$f" ] || { echo "::error::Required file missing from _site: $f"; exit 1; }
          done
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
